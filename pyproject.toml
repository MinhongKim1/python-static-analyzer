[project]
name = "pyanalyzer"
version = "0.1.0"
description = "Compact CFG-based static analyzer for Python"
requires-python = ">=3.11"

[project.scripts]
pyanalyze = "pyanalyzer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]